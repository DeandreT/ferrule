# Canonical format capability reference.
#
# Edit this file, then regenerate the Markdown guide and published site with
# `cargo run -p reference-docs`. `cargo test -p reference-docs` fails while a
# generated region is stale. See README.md in this directory.
#
# Text fields are Markdown limited to plain words and `code` spans; runs of
# whitespace collapse to one space. `summary` is implemented capability backed
# by the listed `evidence` paths. `qualified` names separately recorded routes,
# each limited to its own profile. `unsupported` lists profiles that refuse
# explicitly instead of being approximated.

[[format]]
name = "XML"
source = "yes"
target = "yes"
selection = "`.xml` or `xml_document`"
summary = """
Hierarchical instance I/O with namespace-aware element and attribute names;
XSD-lite with local import graphs, compatible `complexContent` and
scalar-text/attribute-only `simpleContent` derivations, and named model and
attribute groups; `xs:any` and `xs:anyAttribute` wildcards with `##any`,
`##other`, `##local`, `##targetNamespace`, or listed-namespace constraints under
`skip`, declaration-aware `lax`, or closed `strict` processing; bounded DTD
import with internal content-model parameter entities; `xsi:nil`, generic
elements, and ordered mixed content
"""
evidence = [
    "crates/format-xml/src/xsd.rs",
    "crates/format-xml/src/dtd.rs",
    "crates/format-xml/tests/xsd_lax_wildcards.rs",
    "crates/format-xml/tests/xsd_qname_wildcards.rs",
    "crates/format-xml/tests/mixed_content.rs",
]
unsupported = [
    "XSD 1.1 wildcard exclusions (`notNamespace`, `notQName`) and `xs:any` inside `xs:all`",
    "Strict wildcards whose matching declaration set is not closed, and same-local-name strict declarations with incompatible typed shapes",
    "Element wildcard occurrences other than `1..1`, `0..1`, or `0..unbounded`, and optional single-occurrence `skip` wildcards",
    "Sibling elements or attributes that differ only by namespace, because mapping paths use local field names",
    "External DTD subsets and external entities, which are never loaded",
    "Output to a local XML file set or an HTTP URL (`local_xml_file_set` and HTTP sources are input-only)",
]

[[format.qualified]]
route = "Generated Rust and C# XML document APIs"
scope = "Structured or admitted root-view XML boundaries in the indexed route families"
record = "docs/generated-xml-qualification-index.md"

[[format]]
name = "JSON"
source = "yes"
target = "yes"
selection = "`.json`; `.jsonl`, `.ndjson`, or `json_lines` for JSON Lines"
summary = """
Hierarchical instance I/O and JSON Lines; JSON Schema import with
traversal-confined local-file and document-local references, compatible
structural `allOf` intersections, bounded exact scalar `const`/`enum` domains,
numeric ranges and decimal `multipleOf`, array-count, `contains`,
object-property-count, and Unicode string-length intervals, structural
`uniqueItems`, bounded portable `pattern` assertions, closed homogeneous
`patternProperties`, property dependencies, dependent-schema predicates,
single-property-presence conditionals, `propertyNames`, open or closed object
contracts, heterogeneous scalar type arrays, exact scalar `anyOf`,
pairwise-disjoint scalar `oneOf`, selected object alternatives, nullable
scalar/object/array shapes, and typed or unconstrained dynamic properties
"""
evidence = [
    "crates/format-json/src/json_schema.rs",
    "crates/format-json/src/json_schema/tests/resources.rs",
    "crates/format-json/src/json_schema/tests/patterns.rs",
    "crates/json-pattern/src/lib.rs",
]
unsupported = [
    "General heterogeneous array composition, heterogeneous or correlated numeric-range scalar unions, and mixed structural unions",
    "Heterogeneous `prefixItems` or legacy tuple members and active `unevaluatedItems`",
    "Required-only schemas without an object shape",
    "External references from in-memory schema import (`json_schema::import_str`)",
    "Enforcement of other shape-neutral validation keywords, which are accepted only for schema recovery",
]

[[format.qualified]]
route = "Ordered JSON source documents in the native and generated C# runtimes"
scope = "One complete UTF-8 JSON value with ordered and duplicate members, checked against a self-authored corpus"
record = "conformance/json-source/README.md"

[[format]]
name = "JSON5"
source = "yes"
target = "yes"
selection = "`.json5` or `json5`"
summary = """
One schema-shaped document in JSON5 instance syntax with ordinary JSON schemas
and the same typed mapping boundary; input accepts comments, trailing commas,
and single-quoted strings, and is limited to 64 MiB and 128 nested containers;
output omits property-name quotes where JSON5 allows; CLI and browser runtime
"""
evidence = [
    "crates/format-json/tests/json5_original_bytes.rs",
    "crates/format-json/tests/json5_nonfinite.rs",
    "crates/cli/tests/json5_resources.rs",
    "crates/web-demo/src/runtime.rs",
]
unsupported = [
    "Combining JSON5 with JSON Lines",
    "Nonfinite numbers such as `Infinity` and `NaN`",
    "Comment preservation; comments are not mapped or written back",
    "JSON5 in ordinary generated Rust and C# entry points, which exchange strict JSON",
    "Native `.mfd` export of JSON5 boundaries",
]

[[format.qualified]]
route = "Generated Rust and C# JSON5 companions (`generate --json5-adapters`)"
scope = "One JSON5 object in and strict JSON out, for closed nonrepeating object schemas with scalar leaves and static target construction"
record = "docs/generated-json5-contract.md"

[[format]]
name = "CSV"
source = "yes"
target = "yes"
selection = "`.csv` or `.txt`"
summary = """
Delimited flat rows with a configurable delimiter, printable or disabled
quoting, headers, optional present-empty text, and optional UTF-8 BOM output
"""
evidence = [
    "crates/format-csv/src/read.rs",
    "crates/cli/tests/csv_quote_disabled.rs",
    "crates/cli/tests/csv_empty_text.rs",
    "crates/cli/tests/csv_utf8_bom.rs",
]
unsupported = [
    "Unquoted output of field text that requires escaping when quoting is disabled",
]

[[format.qualified]]
route = "Generated Rust and C# complete CSV document adapters (`generate --csv-document-adapters`)"
scope = "One positional CSV document in and out, including header, BOM, and raw-delimited CRLF output modes"
record = "conformance/csv-documents/README.md"

