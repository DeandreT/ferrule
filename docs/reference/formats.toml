[[format]]
name = "SQLite"
source = "yes"
target = "yes"
selection = "`.db`, `.sqlite`, or `.sqlite3`"
summary = """
Read-only table introspection, typed reads, imported relational query shapes,
declared read-only single-table queries with typed named parameters, validated
declared relations, structured XML text columns, and idempotent full-replace
writes
"""
evidence = [
    "crates/format-db/src/relational.rs",
    "crates/format-db/src/query/mod.rs",
    "crates/format-db/tests/readonly_metadata.rs",
    "crates/cli/tests/sqlite_read_query.rs",
]
unsupported = [
    "Other database engines, general SQL mutation, and multi-database connections",
    "SQL text, joins, views and declared queries on payload, stream, REST, pipeline, generated-code and MFD routes",
]

[[format]]
name = "X12 / EDIFACT"
source = "yes"
target = "yes"
selection = "`.edi`, `.x12`, or `.edifact` with a schema dialect, or `edi_kind`"
summary = """
Schema-guided interchange I/O, custom syntax separators, repetitions, qualifier
loops, retained field lengths and code lists, optional lenient parsing, and
bounded output validation that leaves the destination unchanged on failure
"""
evidence = [
    "crates/format-edi/src/x12.rs",
    "crates/format-edi/src/edifact.rs",
    "crates/format-edi/src/validation.rs",
    "crates/cli/tests/edi_output.rs",
]
unsupported = [
    "Invisible or whitespace explicit X12 output separators, including LF",
]

[[format.qualified]]
route = "Generated C# X12 companions (`generate --x12-adapters`)"
scope = "Raw X12 text and bytes with single, grouped, or MapForce-shaped envelope profiles around the ordinary typed mapping"
record = "docs/design/generated-x12-csharp.md"

