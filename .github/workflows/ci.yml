name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      runner:
        description: Runner for this run
        type: choice
        default: auto
        options: [auto, cleo, over, github-hosted]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_DEV_STRIP: symbols
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_TEST_STRIP: symbols
  RUST_TEST_THREADS: "4"

jobs:
  test:
    # Trusted events prefer the Cleo pool with automatic Over fallback; forks stay hosted.
    runs-on: ${{ fromJSON((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository || (inputs.runner || vars.CI_RUNNER || 'auto') == 'github-hosted') && '["ubuntu-latest"]' || (inputs.runner || vars.CI_RUNNER || 'auto') == 'over' && '["self-hosted", "Linux", "X64", "ferrule-over"]' || (inputs.runner || vars.CI_RUNNER || 'auto') == 'cleo' && '["self-hosted", "Linux", "X64", "ferrule-cleo"]' || '["self-hosted", "Linux", "X64", "ferrule-primary"]') }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: CI resource guard tests
        run: |
          bash -n scripts/ci/*.sh
          python3 scripts/ci/test-ovh-build.py
          python3 -B scripts/ci/test-runner-routing.py
          python3 -B scripts/ci/test-runner-failover.py
          python3 -B scripts/ci/test-reclaim-build-cache.py
          python3 scripts/ci/test-job-evidence.py
          python3 -B scripts/ci/test-compact-job-evidence.py
      - name: Self-hosted build resources
        if: runner.environment == 'self-hosted'
        run: bash scripts/ci/prepare-ovh-build.sh
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          shared-key: workspace-bounded-builds
      - name: virtual display
        if: runner.environment == 'github-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        env:
          RUSTC_WRAPPER: ${{ runner.environment == 'self-hosted' && '/opt/ferrule-runner-tools/sccache' || '' }}
        run: >-
          xvfb-run -a env -u WAYLAND_DISPLAY -u WAYLAND_SOCKET LIBGL_ALWAYS_SOFTWARE=1
          cargo test --workspace
          --exclude codegen
          --exclude codegen-runtime
          --exclude codegen-rust
          --exclude codegen-csharp
      - name: Trim successful workspace build
        if: success() && runner.environment == 'self-hosted'
        run: cargo clean --workspace
      # This optional canary contains metadata only. It never marks job evidence archived.
      - name: Metadata evidence canary
        id: evidence_canary
        if: always() && runner.environment == 'self-hosted' && vars.OVH_EVIDENCE_CANARY_ENABLED == 'true' && vars.OVH_EVIDENCE_CANARY_RETENTION_DAYS != '' && env.FERRULE_CI_EVIDENCE_CANARY != ''
        continue-on-error: true
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: evidence-canary-${{ env.FERRULE_CI_EVIDENCE_ID }}
          path: ${{ env.FERRULE_CI_EVIDENCE_CANARY }}
          archive: true
          compression-level: 0
          overwrite: false
          if-no-files-found: error
          retention-days: ${{ vars.OVH_EVIDENCE_CANARY_RETENTION_DAYS }}
      - name: Retain unarchived job observation
        if: always() && runner.environment == 'self-hosted' && env.FERRULE_CI_EVIDENCE_ROOT != ''
        env:
          FERRULE_CI_OBSERVED_JOB_STATE: ${{ job.status }}
          FERRULE_CI_CANARY_OUTCOME: ${{ steps.evidence_canary.outcome }}
        run: python3 -I scripts/ci/job-evidence.py observe
      - name: runner resources
        if: always()
        run: |
          df -h
          free -h
          if [ "$RUNNER_ENVIRONMENT" = self-hosted ] && [ -n "${SCCACHE_DIR:-}" ]; then
            /opt/ferrule-runner-tools/sccache --show-stats
          fi
