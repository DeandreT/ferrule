name: Codegen CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: codegen-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_DEV_STRIP: symbols
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_TEST_STRIP: symbols
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

jobs:
  generated-backends:
    name: generated-backends (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: [crates, mappings]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: codegen-${{ matrix.suite }}-bounded-builds
      - name: clippy
        run: >-
          cargo clippy -p cli --test code_generation
          --features codegen-tests -- -D warnings
      - name: codegen crate tests
        if: matrix.suite == 'crates'
        run: >-
          cargo test
          -p codegen
          -p codegen-runtime
          -p codegen-rust
          -p codegen-csharp
          -- --test-threads=2
      - name: generated Rust and C# parity tests
        if: matrix.suite == 'mappings'
        run: >-
          cargo test -p cli --test code_generation
          --features codegen-tests -- --test-threads=2
      - name: runner resources
        if: always()
        run: |
          df -h
          free -h
