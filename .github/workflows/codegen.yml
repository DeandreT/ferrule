name: Codegen CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codegen-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_DEV_STRIP: symbols
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_TEST_STRIP: symbols
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

jobs:
  generated-backends:
    name: generated-backends (${{ matrix.suite }})
    runs-on: ${{ fromJSON(vars.OVH_RUNNER_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted", "Linux", "X64", "ferrule-ovh"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        suite: [crates, mappings]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: OVH build resources
        if: runner.environment == 'self-hosted'
        run: bash scripts/ci/prepare-ovh-build.sh
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          shared-key: codegen-${{ matrix.suite }}-bounded-builds
      - name: clippy
        run: >-
          cargo clippy -p cli --test code_generation
          --features codegen-tests -- -D warnings
      - name: codegen crate tests
        if: matrix.suite == 'crates'
        env:
          RUSTC_WRAPPER: ${{ runner.environment == 'self-hosted' && '/opt/ferrule-runner-tools/sccache' || '' }}
        run: >-
          cargo test
          -p codegen
          -p codegen-runtime
          -p codegen-rust
          -p codegen-csharp
          -- --test-threads=${{ runner.environment == 'self-hosted' && '1' || '2' }}
      - name: generated Rust and C# parity tests
        if: matrix.suite == 'mappings'
        env:
          RUSTC_WRAPPER: ${{ runner.environment == 'self-hosted' && '/opt/ferrule-runner-tools/sccache' || '' }}
        run: >-
          cargo test -p cli --test code_generation
          --features codegen-tests -- --test-threads=${{ runner.environment == 'self-hosted' && '1' || '2' }}
      - name: runner resources
        if: always()
        run: |
          df -h
          free -h
          if [ "$RUNNER_ENVIRONMENT" = self-hosted ]; then
            /opt/ferrule-runner-tools/sccache --show-stats
          fi
