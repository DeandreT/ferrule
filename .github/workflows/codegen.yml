name: Codegen CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      runner:
        description: Runner choice (dedicated hosts require OVH_RUNNER_ENABLED)
        type: choice
        default: auto
        options: [auto, cleo, over, github-hosted]

permissions:
  contents: read

concurrency:
  group: codegen-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_DEV_STRIP: symbols
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_TEST_STRIP: symbols
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_ADD_GLOBAL_TOOLS_TO_PATH: "false"

jobs:
  generated-backends:
    name: generated-backends (${{ matrix.suite }})
    runs-on: ${{ fromJSON(vars.OVH_RUNNER_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && ((inputs.runner || vars.CI_RUNNER || 'auto') == 'cleo' && '["self-hosted", "Linux", "X64", "ferrule-cleo"]' || (inputs.runner || vars.CI_RUNNER || 'auto') == 'over' && '["self-hosted", "Linux", "X64", "ferrule-over"]' || (inputs.runner || vars.CI_RUNNER || 'auto') == 'auto' && '["self-hosted", "Linux", "X64", "ferrule-primary"]') || '["ubuntu-latest"]') }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        suite: [crates, mappings]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: pre-job space guard tests
        run: |
          python3 -B scripts/ci/test-runner-failover.py
          python3 -B scripts/ci/test-runner-routing.py
          python3 -B scripts/ci/test-runner-provisioning.py
          python3 -B scripts/ci/test-reclaim-build-cache.py
          python3 -B scripts/ci/test-compact-job-evidence.py
          python3 -B scripts/ci/test-prepare-hosted-temp.py
      - name: Hosted disk-backed test temp
        if: runner.environment == 'github-hosted'
        run: python3 -B scripts/ci/prepare-hosted-temp.py
      - name: OVH build resources
        if: runner.environment == 'self-hosted'
        env:
          FERRULE_CI_SUITE: codegen
          FERRULE_CI_EVIDENCE_SUITE: codegen-${{ matrix.suite }}
        run: bash scripts/ci/prepare-ovh-build.sh
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: clippy
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          shared-key: codegen-${{ matrix.suite }}-bounded-builds
      - name: clippy
        run: >-
          cargo clippy -p cli --test code_generation
          --features codegen-tests --locked -- -D warnings
      - name: codegen crate tests
        if: matrix.suite == 'crates'
        env:
          RUSTC_WRAPPER: ${{ runner.environment == 'self-hosted' && '/opt/ferrule-runner-tools/sccache' || '' }}
        run: >-
          cargo test --locked
          -p codegen
          -p codegen-runtime
          -p codegen-rust
          -p codegen-csharp
          -- --test-threads=${{ runner.environment == 'self-hosted' && '1' || '2' }}
      - name: C# runtime smoke tests
        if: matrix.suite == 'crates'
        run: |
          set -euo pipefail
          artifacts="$RUNNER_TEMP/csharp-runtime-smoke"
          mkdir -p "$artifacts"
          dotnet build runtime/csharp/Ferrule.Runtime.SmokeTests --configuration Release \
            --artifacts-path "$artifacts" -nodeReuse:false -p:UseSharedCompilation=false --verbosity quiet
          status=0
          dotnet "$artifacts/bin/Ferrule.Runtime.SmokeTests/release/Ferrule.Runtime.SmokeTests.dll" \
            > "$artifacts/smoke.log" 2>&1 || status=$?
          # The suite prints every raw observation; keep the job log bounded.
          if (( status == 0 )); then
            tail -n 1 "$artifacts/smoke.log"
          else
            tail -c 65536 "$artifacts/smoke.log"
          fi
          exit "$status"
      - name: generated Rust and C# parity tests
        if: matrix.suite == 'mappings'
        env:
          RUSTC_WRAPPER: ${{ runner.environment == 'self-hosted' && '/opt/ferrule-runner-tools/sccache' || '' }}
        run: >-
          cargo test -p cli --test code_generation
          --features codegen-tests --locked -- --test-threads=${{ runner.environment == 'self-hosted' && '1' || '2' }}
      - name: compiled string and integral boundary regressions
        id: compiled_boundaries
        if: matrix.suite == 'mappings'
        env:
          RUSTC_WRAPPER: ${{ runner.environment == 'self-hosted' && '/opt/ferrule-runner-tools/sccache' || '' }}
          CARGO_BUILD_JOBS: "1"
          CARGO_INCREMENTAL: "0"
          RUST_TEST_THREADS: "1"
        run: |
          set -euo pipefail
          evidence_dir=$(mktemp -d "$RUNNER_TEMP/ferrule-compiled-boundaries.XXXXXX")
          printf 'evidence_dir=%s\n' "$evidence_dir" >> "$GITHUB_OUTPUT"
          export FERRULE_CODEGEN_STRING_INT_RANGE_EVIDENCE_DIR="$evidence_dir/originals"
          shared_target="${FERRULE_CODEGEN_HOST_TARGET_DIR:-${CARGO_TARGET_DIR:-$GITHUB_WORKSPACE/target}}"
          printf '%s\n' "$shared_target" > "$evidence_dir/shared-target.original"
          if [[ $shared_target != /* || ! -d $shared_target ]]; then
            echo 'Compiled regressions require the existing absolute shared Cargo target.' > "$evidence_dir/setup-error.original"
            cat "$evidence_dir/setup-error.original" >&2
            exit 1
          fi
          export FERRULE_CODEGEN_HOST_TARGET_DIR="$shared_target"
          reserve_bytes=8589934592
          check_storage() {
            local phase=$1 location label available_bytes
            df --block-size=1 "$shared_target" "$evidence_dir" > "$evidence_dir/$phase.df.original" 2> "$evidence_dir/$phase.df.stderr.original"
            du --summarize --block-size=1 "$shared_target" > "$evidence_dir/$phase.target-allocated.original" 2> "$evidence_dir/$phase.target-allocated.stderr.original"
            du --summarize --apparent-size --block-size=1 "$shared_target" > "$evidence_dir/$phase.target-logical.original" 2> "$evidence_dir/$phase.target-logical.stderr.original"
            for label in target evidence; do
              if [[ $label == target ]]; then location=$shared_target; else location=$evidence_dir; fi
              df --block-size=1 --output=avail "$location" > "$evidence_dir/$phase.$label-free.original" 2> "$evidence_dir/$phase.$label-free.stderr.original"
              available_bytes=$(tail -n 1 "$evidence_dir/$phase.$label-free.original")
              available_bytes="${available_bytes//[[:space:]]/}"
              if [[ ! $available_bytes =~ ^[0-9]+$ ]] || (( available_bytes < reserve_bytes )); then
                printf 'Compiled regressions need at least 8 GiB free on %s (%s bytes available).\n' "$location" "$available_bytes" > "$evidence_dir/$phase.$label-refusal.original"
                cat "$evidence_dir/$phase.$label-refusal.original" >&2
                return 1
              fi
            done
            cat "$evidence_dir/$phase.df.original" "$evidence_dir/$phase.target-allocated.original" "$evidence_dir/$phase.target-logical.original"
          }
          result=0
          for test_name in \
            string_int_range_boundaries::string_int_ranges_compiled_rust_and_csharp_complete_text_and_bytes \
            string_int_range_boundaries::exact_integral_schema_bounds_compiled_rust_and_csharp_complete_text_and_bytes; do
            test_label="${test_name##*::}"
            check_storage "$test_label.before"
            printf '%s\n' "cargo test -p cli --test code_generation --features codegen-tests --locked $test_name -- --ignored --exact --nocapture --test-threads=1" > "$evidence_dir/$test_label.command.original"
            set +e
            cargo test -p cli --test code_generation --features codegen-tests --locked "$test_name" \
              -- --ignored --exact --nocapture --test-threads=1 \
              > "$evidence_dir/$test_label.stdout.original" 2> "$evidence_dir/$test_label.stderr.original"
            status=$?
            set -e
            printf '%s\n' "$status" > "$evidence_dir/$test_label.exit-status.original"
            cat "$evidence_dir/$test_label.stdout.original" "$evidence_dir/$test_label.stderr.original"
            if (( status != 0 )) || ! grep -Fxq 'running 1 test' "$evidence_dir/$test_label.stdout.original"; then
              result=1
            fi
            check_storage "$test_label.after"
          done
          exit "$result"
      - name: retain compiled boundary verification originals
        if: always() && matrix.suite == 'mappings' && steps.compiled_boundaries.outputs.evidence_dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: compiled-boundaries-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.compiled_boundaries.outputs.evidence_dir }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
      - name: compiled portable cohort consumers
        if: matrix.suite == 'mappings'
        env:
          RUSTC_WRAPPER: ${{ runner.environment == 'self-hosted' && '/opt/ferrule-runner-tools/sccache' || '' }}
          CARGO_BUILD_JOBS: "1"
          CARGO_INCREMENTAL: "0"
          RUST_TEST_THREADS: "1"
        run: |
          set -euo pipefail
          # The harnesses refuse a host target that overlaps the workspace target.
          export FERRULE_CODEGEN_HOST_TARGET_DIR="$RUNNER_TEMP/ferrule-cohort-host-target"
          mkdir -p "$FERRULE_CODEGEN_HOST_TARGET_DIR"
          logs=$(mktemp -d "$RUNNER_TEMP/ferrule-cohort-consumers.XXXXXX")
          result=0
          for test_name in \
            basic_owned_occurrence::basic_occurrence640_generated_rust_and_csharp_match_expected \
            basic_owned_filter::basic_filter662_generated_rust_and_csharp_match_expected \
            basic_owned_nested_alias::basic_nestedalias688_generated_rust_and_csharp_match_expected \
            basic_owned_sort::basic_sort670_generated_rust_and_csharp_match_expected \
            basic_owned_windows::basic_windows704_generated_rust_and_csharp_match_expected \
            basic_owned_sequence_exists::basic_exists472_generated_rust_and_csharp_match_expected \
            basic_owned_sequence_aggregate::basic_aggregate474_generated_rust_and_csharp_match_expected; do
            log="$logs/${test_name##*::}.log"
            set +e
            cargo test -p cli --test code_generation --features codegen-tests --locked "$test_name" \
              -- --ignored --exact --test-threads=1 > "$log" 2>&1
            status=$?
            set -e
            # Host failures already quote bounded excerpts; keep the job log bounded too.
            tail -c 65536 "$log"
            if (( status != 0 )) || ! grep -Fxq 'running 1 test' "$log"; then
              result=1
            fi
          done
          exit "$result"
      - name: Trim successful workspace build
        if: success() && runner.environment == 'self-hosted'
        run: cargo clean --workspace
      # This optional canary contains metadata only. It never marks job evidence archived.
      - name: Metadata evidence canary
        id: evidence_canary
        if: always() && runner.environment == 'self-hosted' && vars.OVH_EVIDENCE_CANARY_ENABLED == 'true' && vars.OVH_EVIDENCE_CANARY_RETENTION_DAYS != '' && env.FERRULE_CI_EVIDENCE_CANARY != ''
        continue-on-error: true
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: evidence-canary-${{ env.FERRULE_CI_EVIDENCE_ID }}
          path: ${{ env.FERRULE_CI_EVIDENCE_CANARY }}
          archive: true
          compression-level: 0
          overwrite: false
          if-no-files-found: error
          retention-days: ${{ vars.OVH_EVIDENCE_CANARY_RETENTION_DAYS }}
      - name: Retain unarchived job observation
        if: always() && runner.environment == 'self-hosted' && env.FERRULE_CI_EVIDENCE_ROOT != ''
        env:
          FERRULE_CI_OBSERVED_JOB_STATE: ${{ job.status }}
          FERRULE_CI_CANARY_OUTCOME: ${{ steps.evidence_canary.outcome }}
          FERRULE_CI_SUITE: codegen
          FERRULE_CI_EVIDENCE_SUITE: codegen-${{ matrix.suite }}
        run: python3 -I scripts/ci/job-evidence.py observe
      - name: runner resources
        if: always()
        run: |
          df -h
          free -h
          if [ "$RUNNER_ENVIRONMENT" = self-hosted ] && [ -n "${SCCACHE_DIR:-}" ]; then
            /opt/ferrule-runner-tools/sccache --show-stats
          fi
