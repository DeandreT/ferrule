[workspace]
resolver = "3"
members = [
    "crates/edit-ops",
    "crates/editor-ui",
    "crates/json-pattern",
    "crates/mfd-conformance",
    "crates/reference-docs",
    "crates/ir",
    "crates/mapping",
    "crates/document-source",
    "crates/functions",
    "crates/engine",
    "crates/codegen",
    "crates/codegen-schema",
    "crates/codegen-runtime",
    "crates/codegen-rust",
    "crates/codegen-csharp",
    "crates/format-xml",
    "crates/format-json",
    "crates/format-csv",
    "crates/format-xlsx",
    "crates/format-db",
    "crates/format-edi",
    "crates/format-edi-config",
    "crates/format-flextext",
    "crates/format-pdf",
    "crates/pdf-worker",
    "crates/format-protobuf",
    "crates/format-xbrl",
    "crates/mfd",
    "crates/cli",
    "crates/gui",
    "crates/web-demo",
]
# A path dependency, not a member: its upstream sources keep their own lints and docs.
exclude = ["vendor/rust_xlsxwriter"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/DeandreT/ferrule"

[workspace.dependencies]
edit-ops = { path = "crates/edit-ops" }
editor-ui = { path = "crates/editor-ui" }
json-pattern = { path = "crates/json-pattern" }
ir = { path = "crates/ir" }
mapping = { path = "crates/mapping" }
document-source = { path = "crates/document-source" }
functions = { path = "crates/functions" }
engine = { path = "crates/engine" }
codegen = { path = "crates/codegen" }
codegen-schema = { path = "crates/codegen-schema" }
codegen-runtime = { path = "crates/codegen-runtime" }
codegen-rust = { path = "crates/codegen-rust" }
codegen-csharp = { path = "crates/codegen-csharp" }
format-xml = { path = "crates/format-xml" }
format-json = { path = "crates/format-json" }
format-csv = { path = "crates/format-csv" }
format-xlsx = { path = "crates/format-xlsx" }
format-db = { path = "crates/format-db" }
format-edi = { path = "crates/format-edi" }
format-edi-config = { path = "crates/format-edi-config" }
format-flextext = { path = "crates/format-flextext" }
format-pdf = { path = "crates/format-pdf" }
format-protobuf = { path = "crates/format-protobuf" }
format-xbrl = { path = "crates/format-xbrl" }
mfd = { path = "crates/mfd" }
cli = { path = "crates/cli" }

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.10.9"
unicode-normalization = "0.1.25"
json5 = "1.3.1"
thiserror = "2"
toml = { version = "1.1", default-features = false, features = ["parse", "serde"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
csv = "1"
calamine = { version = "0.36", default-features = false }
# Thread-free save; see vendor/rust_xlsxwriter/README.md.
rust_xlsxwriter = { path = "vendor/rust_xlsxwriter", version = "0.96.0", default-features = false }
umya-spreadsheet = { version = "3.0.1", default-features = false }
roxmltree = "0.21.2"
quick-xml = "0.41"
egui = { version = "0.37", features = ["default_fonts"] }
eframe = "0.37"
egui-snarl = "0.11"
lucide-icons = "1.24"
rfd = "0.17"
rusqlite = { version = "0.37", features = ["bundled"] }
jiff = "0.2.32"
ureq = { version = "3.3", default-features = false, features = ["rustls"] }
rustix = { version = "1.1", features = ["fs"] }
pdf-extract = "0.12"
regex = "1"
uuid = { version = "1", features = ["js", "v4"] }
rand = "0.10"
zip = { version = "7.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[patch.crates-io]
egui-snarl = { path = "vendor/egui-snarl" }
egui-scale = { path = "vendor/egui-scale" }

# Owned PDF worker jobs hash whole packaged executables and job artifacts;
# unoptimized SHA-256 would dominate debug builds and tests.
[profile.dev.package.sha2]
opt-level = 3
