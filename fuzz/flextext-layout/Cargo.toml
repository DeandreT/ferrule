[package]
name = "flextext-layout-fuzz"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[package.metadata]
cargo-fuzz = true

# Standalone harness: an empty workspace table keeps this package and its
# lockfile out of the root ferrule workspace.
[workspace]

[lib]
path = "src/lib.rs"

[dependencies]
format-flextext = { path = "../../crates/format-flextext" }
ir = { path = "../../crates/ir" }
libfuzzer-sys = "0.4"
mapping = { path = "../../crates/mapping" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "layout"
path = "fuzz_targets/layout.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
