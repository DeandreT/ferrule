[package]
name = "cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Headless runner: executes a ferrule mapping project against input file(s) to produce output file(s)"
default-run = "ferrule"

[[bin]]
name = "ferrule"
path = "src/main.rs"

[features]
codegen-tests = []

[[test]]
name = "code_generation"
path = "tests/code_generation.rs"
required-features = ["codegen-tests"]

[dependencies]
ir = { workspace = true }
mapping = { workspace = true }
document-source = { workspace = true }
engine = { workspace = true }
codegen = { workspace = true }
codegen-schema = { workspace = true }
codegen-rust = { workspace = true }
codegen-csharp = { workspace = true }
codegen-runtime = { workspace = true }
format-csv = { workspace = true }
format-xlsx = { workspace = true }
format-xml = { workspace = true }
format-json = { workspace = true }
format-db = { workspace = true }
format-edi = { workspace = true }
format-flextext = { workspace = true }
format-protobuf = { workspace = true }
format-pdf = { workspace = true }
pdf-worker = { path = "../pdf-worker" }
format-xbrl = { workspace = true }
mfd = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
unicode-normalization = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
anyhow = { workspace = true }
jiff = { workspace = true }
ureq = { workspace = true }

[target.'cfg(any(target_os = "android", target_os = "linux", target_os = "macos", target_os = "ios", target_os = "tvos", target_os = "visionos", target_os = "watchos", target_os = "redox"))'.dependencies]
rustix = { workspace = true }

[dev-dependencies]
flate2 = "1.1"
roxmltree = { workspace = true }
rusqlite = { workspace = true }
rust_xlsxwriter = { workspace = true }
toml = { workspace = true }

[target.'cfg(all(target_os = "linux", target_arch = "x86_64", target_env = "gnu"))'.dependencies]
libc = "=0.2.186"

[[bin]]
name = "ferrule-pdf-worker"
path = "src/bin/pdf_worker.rs"
