[package]
name = "codegen-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Small runtime support library for Rust code generated by ferrule"

[features]
native-source-io = ["dep:ureq", "dep:url"]
native-source-ftp = ["native-source-io", "dep:suppaftp", "dep:percent-encoding"]

[dependencies]
codegen-schema = { workspace = true }
functions = { workspace = true }
format-csv = { workspace = true }
format-edi = { workspace = true }
format-json = { workspace = true }
format-xml = { workspace = true }
ir = { workspace = true }
json-pattern = { workspace = true }
mapping = { workspace = true }
quick-xml = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ureq = { workspace = true, optional = true }
url = { version = "=2.5.8", optional = true }
suppaftp = { version = "=12.2.1", default-features = false, optional = true }
percent-encoding = { version = "=2.3.2", optional = true }
