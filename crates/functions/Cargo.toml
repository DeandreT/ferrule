[package]
name = "functions"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Built-in function library (string/math/date/aggregate/node-set) plus user-defined function hooks"

[features]
default = ["runtime"]
runtime = ["dep:uuid", "dep:rand"]
json-projection-instrumentation = ["runtime", "format-json/document-dom-instrumentation"]

[dependencies]
ir = { workspace = true }
format-json = { workspace = true }
format-flextext = { workspace = true }
mapping = { workspace = true }
regex = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true, optional = true }
rand = { workspace = true, optional = true }

[dev-dependencies]
format-json = { workspace = true, features = ["document-dom-instrumentation"] }
