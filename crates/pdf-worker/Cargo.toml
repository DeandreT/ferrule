[package]
name = "pdf-worker"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Bounded PDF worker wire protocol and opt-in filesystem host"

[dependencies]
ir = { workspace = true }
mapping = { workspace = true }
format-pdf = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["unbounded_depth"] }
sha2 = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(all(target_os = "linux", target_arch = "x86_64", target_env = "gnu"))'.dependencies]
libc = "=0.2.186"

[features]
host-tests = []

# Plain `cargo test` builds the fixture worker and runs the owned host tests.
[dev-dependencies]
pdf-worker = { path = ".", features = ["host-tests"] }

[[bin]]
name = "pdf-worker-fixture"
path = "tests/support/worker_fixture.rs"
required-features = ["host-tests"]
